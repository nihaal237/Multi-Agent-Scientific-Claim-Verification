stages:
  ingest:
    cmd: python -m src.ingest
    deps:
      - src/ingest.py
    outs:
      - data/raw

  validate:
    cmd: python -m src.validate
    deps:
      - src/validate.py
      - data/raw
    outs:
      - reports/validation.json

  preprocess:
    cmd: python -m src.preprocess
    deps:
      - src/preprocess.py
      - data/raw
      - reports/validation.json
    outs:
      - data/processed

  build_index:
    cmd: python -m src.build_index
    deps:
      - src/build_index.py
      - data/processed/chunks.jsonl
      - configs/retrieval.yaml
    outs:
      - artifacts/index/qdrant

  evaluate_bm25:
    cmd: python -m src.evaluation.evaluate_bm25
    deps:
      - src/evaluation/evaluate_bm25.py
      - src/retrieval/bm25.py
      - data/processed/documents.jsonl
      - data/processed/claims_dev.jsonl
    metrics:
      - reports/bm25_retrieval_metrics.json

  evaluate_semantic:
     cmd: python -m src.evaluation.evaluate_retrieval
     deps:
      - src/evaluation/evaluate_retrieval.py
      - configs/retrieval.yaml
      - data/processed/claims_dev.jsonl
      - artifacts/index/qdrant
     metrics:
      - reports/semantic_retrieval_metrics.json

  evaluate_hybrid:
     cmd: python -m src.evaluation.evaluate_hybrid
     deps:
      - src/evaluation/evaluate_hybrid.py
      - src/retrieval/hybrid.py
      - src/retrieval/bm25.py
      - configs/hybrid.yaml
      - configs/retrieval.yaml
      - data/processed/documents.jsonl
      - data/processed/claims_dev.jsonl
      - artifacts/index/qdrant
     metrics:
      - reports/hybrid_retrieval_metrics.json

  evaluate_bm25_nli:
    cmd: python -m src.evaluation.evaluate_end_to_end --mode baseline
    deps:
      - src/evaluation/evaluate_end_to_end.py
      - src/agents
      - src/retrieval/bm25.py
      - configs/verification.yaml
      - data/processed/claims_dev.jsonl
      - data/processed/documents.jsonl
    metrics:
      - reports/bm25_nli_end_to_end_metrics.json

  evaluate_agent:
    cmd: python -m src.evaluation.evaluate_end_to_end --mode agent
    deps:
      - src/evaluation/evaluate_end_to_end.py
      - src/agents
      - src/retrieval
      - configs/verification.yaml
      - configs/hybrid.yaml
      - configs/retrieval.yaml
      - data/processed/claims_dev.jsonl
      - data/processed/documents.jsonl
      - artifacts/index/qdrant
    metrics:
      - reports/agent_end_to_end_metrics.json